<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Diagnostic Facebook – Matavai Studio</title>
<meta name="description" content="Diagnostic et propositions pour une page Facebook institutionnelle – Cécile Koessler, Matavai Studio.">
<style>
  :root{--bg:#f5efe3;--ink:#3f5a3a;--gold:#b8923a;--muted:#6f6b5e}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
  .wrap{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:12px 12px 8px}
  #book{max-width:100%;}
  .page{background:#fff;box-shadow:0 0 1px rgba(0,0,0,.15)}
  .page img{width:100%;height:100%;object-fit:contain;display:block;user-select:none;-webkit-user-drag:none}
  .bar{display:flex;align-items:center;gap:14px;margin-top:10px;font-size:13px;color:var(--muted)}
  .bar button{background:var(--ink);color:#fff;border:0;border-radius:999px;width:38px;height:38px;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center}
  .bar button:disabled{opacity:.3;cursor:default}
  .bar a{color:var(--gold);text-decoration:none;font-weight:600}
</style>
</head>
<body>
<div class="wrap">
  <div id="book"></div>
  <div class="bar">
    <button id="prev" aria-label="Page précédente">‹</button>
    <span id="count">1 / 4</span>
    <button id="next" aria-label="Page suivante">›</button>
    <a href="Diagnostic_Facebook_Matavai_Studio_exemple.pdf" target="_blank" rel="noopener">PDF</a>
  </div>
</div>
<script src="vendor/page-flip.browser.js"></script>
<script>
  const TOTAL = 4;
  const book = document.getElementById('book');
  for (let i = 1; i <= TOTAL; i++) {
    const d = document.createElement('div');
    d.className = 'page';
    if (i === 1 || i === TOTAL) d.dataset.density = 'hard';
    const img = document.createElement('img');
    img.src = 'pages/' + String(i).padStart(2, '0') + '.webp';
    img.alt = 'Page ' + i;
    img.loading = i <= 2 ? 'eager' : 'lazy';
    d.appendChild(img);
    book.appendChild(d);
  }
  const RATIO = 1754 / 1240;
  function size() {
    const w = window.innerWidth - 24, h = window.innerHeight - 70;
    const two = w > 760;
    let pw = two ? w / 2 : w;
    let ph = pw * RATIO;
    if (ph > h) { ph = h; pw = ph / RATIO; }
    return { pw: Math.floor(pw), ph: Math.floor(ph) };
  }
  const s = size();
  const flip = new St.PageFlip(book, {
    width: s.pw, height: s.ph, size: 'fixed',
    showCover: true, usePortrait: true, mobileScrollSupport: false,
    maxShadowOpacity: 0.35, flippingTime: 700
  });
  flip.loadFromHTML(document.querySelectorAll('.page'));
  const count = document.getElementById('count'), prev = document.getElementById('prev'), next = document.getElementById('next');
  function update() {
    const i = flip.getCurrentPageIndex();
    const shown = flip.getOrientation() === 'landscape' && i > 0 && i < TOTAL - 1 ? (i + 1) + '–' + Math.min(i + 2, TOTAL) : (i + 1);
    count.textContent = shown + ' / ' + TOTAL;
    prev.disabled = i === 0;
    next.disabled = i >= TOTAL - 1 || (flip.getOrientation() === 'landscape' && i >= TOTAL - 2 && i > 0);
  }
  flip.on('flip', update); flip.on('changeOrientation', update);
  prev.onclick = () => flip.flipPrev(); next.onclick = () => flip.flipNext();
  document.addEventListener('keydown', e => { if (e.key === 'ArrowLeft') flip.flipPrev(); if (e.key === 'ArrowRight') flip.flipNext(); });
  let t; window.addEventListener('resize', () => { clearTimeout(t); t = setTimeout(() => location.reload(), 400); });
  update();
</script>
</body>
</html>
